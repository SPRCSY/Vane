services:
  vane:
    image: localhost/vane:latest
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        NEXT_DEPS_IMAGE: ${VANE_NEXT_DEPS_IMAGE:-localhost/vane-next-deps:local}
        RUNTIME_BASE_IMAGE: ${VANE_RUNTIME_BASE_IMAGE:-localhost/vane-runtime-base:local}
    ports:
      - '3000:3000'
    environment:
      HOSTNAME: '0.0.0.0'
    dns:
      - 192.168.5.1
      - 8.8.8.8
    volumes:
      - data:/home/vane/data
    restart: unless-stopped

# 固定网卡名为 br-vane，nftables 规则不会因 docker compose down/up 而失效
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-vane"

volumes:
  data:
    name: 'vane-data'
